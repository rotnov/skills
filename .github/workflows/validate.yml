name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked development environment
        run: |
          uv lock --check
          uv sync --frozen

      - name: Validate repository contracts
        run: |
          uv run --frozen python scripts/validate_skills.py
          uv run --frozen python -m unittest discover -s tests -v

      - name: Verify invitation authorization in disposable PostgreSQL
        run: |
          npm ci --prefix tests/quorum-backend --no-audit --no-fund
          npm test --prefix tests/quorum-backend

      - name: Validate the official Agent Skills format
        run: ./scripts/check-agent-skills-spec.sh

      - name: Verify skills.sh discovery and installation
        run: ./scripts/check-skills-cli.sh

      - name: Require the complete pre-commit gate
        run: uv run --frozen pre-commit run --all-files

  macos-transport:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify native Claude Unix socket without a model
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p test_quorum_claude_pipe.py -v

      - name: Verify scoped task intake and listener heartbeat without models
        run: |
          uv run --project skills/quorum --frozen python -m unittest discover -s tests -p test_quorum_delegation.py -v
          uv run --project skills/quorum --frozen python -m unittest discover -s tests -p test_quorum_presence.py -v

      - name: Verify native Realtime wakeups without a provider
        run: uv run --project skills/quorum --frozen python -m unittest discover -s tests -p test_quorum_realtime.py -v

      - name: Verify experimental Grok existing-TUI IPC without a model
        run: uv run --project skills/quorum --frozen python -m unittest discover -s tests -p test_quorum_grok.py -v

  windows-acl:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify private ACLs without the SACL privilege
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p test_quorum_windows_acl.py -v

      - name: Verify native listener lifecycle without model providers
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p test_quorum_listener.py -v

      - name: Verify copy-installed native session transport without providers
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p test_quorum_session.py -v

      - name: Verify native Claude named-pipe transport without a model
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p test_quorum_claude_pipe.py -v

      - name: Verify standalone ID onboarding without model providers
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p test_quorum_invite_id.py -v

      - name: Verify shared machine login and refresh serialization
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -p test_quorum_profiles.py -v

      - name: Verify scoped task intake and listener heartbeat without models
        run: |
          uv run --project skills/quorum --frozen python -m unittest discover -s tests -p test_quorum_delegation.py -v
          uv run --project skills/quorum --frozen python -m unittest discover -s tests -p test_quorum_presence.py -v

      - name: Verify native Realtime wakeups without a provider
        run: uv run --project skills/quorum --frozen python -m unittest discover -s tests -p test_quorum_realtime.py -v
