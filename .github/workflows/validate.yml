name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PRE_COMMIT_VERSION: "4.6.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate repository contracts
        run: |
          python3 scripts/validate_skills.py
          python3 -m unittest discover -s tests -v

      - name: Validate the official Agent Skills format
        run: ./scripts/check-agent-skills-spec.sh

      - name: Verify skills.sh discovery and installation
        run: ./scripts/check-skills-cli.sh

      - name: Require the complete pre-commit gate
        run: |
          python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files
