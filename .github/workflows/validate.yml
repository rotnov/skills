name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked development environment
        run: |
          uv lock --check
          uv sync --frozen

      - name: Validate repository contracts
        run: |
          uv run --frozen python scripts/validate_skills.py
          uv run --frozen python -m unittest discover -s tests -v

      - name: Validate the official Agent Skills format
        run: ./scripts/check-agent-skills-spec.sh

      - name: Verify skills.sh discovery and installation
        run: ./scripts/check-skills-cli.sh

      - name: Require the complete pre-commit gate
        run: uv run --frozen pre-commit run --all-files
